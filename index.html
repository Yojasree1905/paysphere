<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaySphere — Digital Wallet & Intelligent Fraud Analytics</title>
    
    <!-- Dependencies loaded via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0b0f17;
            color: #f1f5f9;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_BASE_URL = 'http://localhost:8000';

        // Built-in Pure SVG Icons
        function Icon({ name, className = "w-4 h-4" }) {
            const icons = {
                wallet: <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3v4a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V7" />,
                "credit-card": <><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></>,
                "shield-alert": <><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>,
                bot: <><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></>,
                "bar-chart-3": <><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></>,
                send: <><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></>,
                "help-circle": <><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></>,
                "arrow-right": <><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></>,
                cpu: <><rect width="12" height="12" x="6" y="6" rx="2"/><path d="M9 18v3"/><path d="M15 18v3"/><path d="M9 3v3"/><path d="M15 3v3"/><path d="M3 9h3"/><path d="M3 15h3"/><path d="M18 9h3"/><path d="M18 15h3"/></>,
                layers: <><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></>,
                "book-open": <><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>
            };

            return (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || icons.wallet}
                </svg>
            );
        }

        const INITIAL_TRANSACTIONS = [
            { id: "TXN-90412", date: "2026-09-02 18:32", recipient: "AWS Cloud Services", category: "Tech & Hosting", amount: 14999.00, type: "Debit", riskScore: 12, riskLevel: "Low Risk", status: "Approved" },
            { id: "TXN-90411", date: "2026-09-02 14:15", recipient: "International Forex Exchange", category: "Wire Transfer", amount: 245000.00, type: "Debit", riskScore: 84, riskLevel: "High Risk", status: "Flagged" },
            { id: "TXN-90410", date: "2026-09-01 20:05", recipient: "Stripe Payout - Client Payment", category: "Income", amount: 120000.00, type: "Credit", riskScore: 5, riskLevel: "Low Risk", status: "Approved" },
            { id: "TXN-90409", date: "2026-09-01 13:40", recipient: "Subway Foods & Dining", category: "Dining", amount: 1850.00, type: "Debit", riskScore: 8, riskLevel: "Low Risk", status: "Approved" },
            { id: "TXN-90408", date: "2026-08-31 19:20", recipient: "Crypto Gateway Node #82", category: "Digital Assets", amount: 89000.00, type: "Debit", riskScore: 68, riskLevel: "Medium Risk", status: "Approved" },
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('wallet');
            const [balance, setBalance] = useState(485000.50);
            const [transactions, setTransactions] = useState(INITIAL_TRANSACTIONS);
            const [selectedTxn, setSelectedTxn] = useState(null);
            const [showGuideModal, setShowGuideModal] = useState(false);
            const [apiConnected, setApiConnected] = useState(false);

            // Send Money Form State
            const [sendRecipient, setSendRecipient] = useState('');
            const [sendAmount, setSendAmount] = useState('');
            const [sendCategory, setSendCategory] = useState('Transfer');
            const [isAuthorizing, setIsAuthorizing] = useState(false);

            // ML Model Simulator State
            const [mlAmount, setMlAmount] = useState('85000');
            const [mlVelocity, setMlVelocity] = useState('3');
            const [mlGeoDist, setMlGeoDist] = useState('120');
            const [mlRiskScore, setMlRiskScore] = useState(62);

            // AI Chat State
            const [chatMessages, setChatMessages] = useState([
                { sender: 'bot', text: '👋 Hi! I am your PaySphere AI Financial Assistant. Ask me anything like "Why was my transfer flagged?" or "How does fraud detection work?"' }
            ]);
            const [chatInput, setChatInput] = useState('');

            // Check if Python FastAPI Backend is active
            useEffect(() => {
                fetch(`${API_BASE_URL}/api/v1/health`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === "online") {
                            setApiConnected(true);
                        }
                    })
                    .catch(() => setApiConnected(false));
            }, []);

            // Calculate ML Risk Score dynamically
            const handleCalculateRisk = (newAmt, newVel, newGeo) => {
                const amt = parseFloat(newAmt !== undefined ? newAmt : mlAmount) || 0;
                const vel = parseInt(newVel !== undefined ? newVel : mlVelocity) || 1;
                const geo = parseFloat(newGeo !== undefined ? newGeo : mlGeoDist) || 0;

                let amountPts = 0;
                if (amt <= 5000) {
                    amountPts = (amt / 5000) * 15;
                } else if (amt <= 50000) {
                    amountPts = 15 + ((amt - 5000) / 45000) * 20;
                } else {
                    amountPts = 35 + Math.min(25, ((amt - 50000) / 50000) * 25);
                }

                const velPts = Math.min(25, (vel / 10) * 25);
                const geoPts = Math.min(15, (geo / 1000) * 15);

                let score = Math.min(99, Math.max(5, Math.round(amountPts + velPts + geoPts)));
                setMlRiskScore(score);
            };

            // Process New Peer-to-Peer Transfer
            const handleSendMoney = async (e) => {
                e.preventDefault();
                const amt = parseFloat(sendAmount);
                if (!sendRecipient || !amt || amt <= 0 || amt > balance) {
                    alert("Please enter a valid recipient and an amount within your balance.");
                    return;
                }

                setIsAuthorizing(true);
                let risk = 0;
                let riskLabel = "Low Risk";
                let statusLabel = "Approved";
                let txnId = `TXN-${Math.floor(10000 + Math.random() * 90000)}`;

                try {
                    const res = await fetch(`${API_BASE_URL}/api/v1/transaction/authorize`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sender_id: "USER-8910",
                            recipient: sendRecipient,
                            amount: amt,
                            category: sendCategory,
                            velocity_count: 2,
                            geo_distance_km: 15.0
                        })
                    });
                    const data = await res.json();
                    risk = data.risk_score;
                    riskLabel = data.risk_level;
                    statusLabel = data.status;
                    txnId = data.transaction_id;
                } catch (err) {
                    let amountPts = amt <= 5000 ? (amt / 5000) * 15 : (amt <= 50000 ? 15 + ((amt - 5000) / 45000) * 20 : 35 + Math.min(25, ((amt - 50000) / 50000) * 25));
                    let catPenalty = (sendCategory.toLowerCase() === 'dining' && amt > 25000) ? 20 : 0;
                    risk = Math.min(98, Math.round(amountPts + 10 + catPenalty));
                    riskLabel = risk > 70 ? "High Risk" : (risk > 40 ? "Medium Risk" : "Low Risk");
                    statusLabel = risk > 70 ? "Flagged" : (risk > 40 ? "Requires 2FA" : "Approved");
                }

                const newTxn = {
                    id: txnId,
                    date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                    recipient: sendRecipient,
                    category: sendCategory,
                    amount: amt,
                    type: "Debit",
                    riskScore: risk,
                    riskLevel: riskLabel,
                    status: statusLabel
                };

                if (statusLabel === "Approved") {
                    setBalance(prev => prev - amt);
                }
                setTransactions([newTxn, ...transactions]);
                setSendRecipient('');
                setSendAmount('');
                setIsAuthorizing(false);

                alert(`Transaction Processed!\nStatus: ${statusLabel}\nAI Risk Score: ${risk}/100 (${riskLabel})`);
            };

            // AI Chat handler
            const handleSendMessage = (e) => {
                e.preventDefault();
                if (!chatInput.trim()) return;

                const userMsg = chatInput.trim();
                const updated = [...chatMessages, { sender: 'user', text: userMsg }];
                setChatMessages(updated);
                setChatInput('');

                setTimeout(() => {
                    let reply = "I analyzed your recent transactions. Your overall spending risk profile is LOW (14/100).";
                    const lower = userMsg.toLowerCase();

                    if (lower.includes("flagged") || lower.includes("fraud")) {
                        reply = "Transaction TXN-90411 (₹2,45,000.00 to Forex Exchange) was flagged because the amount was very large and originated from a new IP location.";
                    } else if (lower.includes("dining") || lower.includes("food")) {
                        reply = "You spent ₹1,850.00 on Dining this week. Your monthly food budget is 92% intact.";
                    } else if (lower.includes("spend") || lower.includes("predict")) {
                        reply = "Based on your recent transfers, your estimated spending for next week is ₹32,000.00.";
                    } else if (lower.includes("how") || lower.includes("work")) {
                        reply = "PaySphere evaluates transactions using a Machine Learning algorithm (Isolation Forest) looking at 3 things: Amount (₹), Transfer Speed (Velocity), and Location Distance (km).";
                    }

                    setChatMessages([...updated, { sender: 'bot', text: reply }]);
                }, 400);
            };

            return (
                <div className="min-h-screen pb-12">
                    {/* Top Navigation Header */}
                    <header className="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50 backdrop-blur-md">
                        <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
                                    <Icon name="wallet" className="w-5 h-5 text-white" />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold gradient-text tracking-tight">PaySphere</h1>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Digital Wallet & AI Analytics</p>
                                </div>
                            </div>

                            <div className="flex items-center space-x-4">
                                <button onClick={() => setShowGuideModal(true)} className="bg-purple-600/20 hover:bg-purple-600/30 border border-purple-500/30 text-purple-300 text-xs font-bold px-3 py-1.5 rounded-full flex items-center space-x-1.5 transition-all">
                                    <Icon name="help-circle" className="w-4 h-4 text-purple-400" />
                                    <span>How It Works Guide</span>
                                </button>

                                <div className="hidden sm:flex items-center space-x-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-full">
                                    <span className={`w-2 h-2 rounded-full ${apiConnected ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                                    <span className="text-xs text-slate-300 font-medium">
                                        Python API: {apiConnected ? 'Connected' : 'Offline (Client Mode)'}
                                    </span>
                                </div>

                                <div className="text-right">
                                    <p className="text-[10px] text-slate-400 font-medium">Balance</p>
                                    <p className="text-base font-extrabold text-emerald-400 tracking-tight">₹{balance.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</p>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Navigation Tabs */}
                    <main className="max-w-7xl mx-auto px-6 pt-8">
                        <div className="flex space-x-2 border-b border-slate-800 mb-8 overflow-x-auto">
                            <button onClick={() => setActiveTab('wallet')} className={`pb-3 px-4 text-sm font-semibold flex items-center space-x-2 border-b-2 transition-all whitespace-nowrap ${activeTab === 'wallet' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                                <Icon name="credit-card" className="w-4 h-4" />
                                <span>1. Send Money & History</span>
                            </button>
                            <button onClick={() => setActiveTab('fraud')} className={`pb-3 px-4 text-sm font-semibold flex items-center space-x-2 border-b-2 transition-all whitespace-nowrap ${activeTab === 'fraud' ? 'border-purple-500 text-purple-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                                <Icon name="shield-alert" className="w-4 h-4" />
                                <span>2. AI Fraud Detector Simulator</span>
                            </button>
                            <button onClick={() => setActiveTab('ai')} className={`pb-3 px-4 text-sm font-semibold flex items-center space-x-2 border-b-2 transition-all whitespace-nowrap ${activeTab === 'ai' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                                <Icon name="bot" className="w-4 h-4" />
                                <span>3. AI Assistant Chat</span>
                            </button>
                            <button onClick={() => setActiveTab('analytics')} className={`pb-3 px-4 text-sm font-semibold flex items-center space-x-2 border-b-2 transition-all whitespace-nowrap ${activeTab === 'analytics' ? 'border-amber-500 text-amber-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                                <Icon name="bar-chart-3" className="w-4 h-4" />
                                <span>4. System Stats</span>
                            </button>
                        </div>

                        {/* TAB 1: WALLET & TRANSFERS */}
                        {activeTab === 'wallet' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div className="space-y-6">
                                    <div className="glass-card p-6 rounded-2xl">
                                        <h3 className="text-base font-bold text-white mb-4 flex items-center space-x-2">
                                            <Icon name="send" className="w-4 h-4 text-blue-400" />
                                            <span>Send Money</span>
                                        </h3>

                                        <form onSubmit={handleSendMoney} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-400 mb-1">Recipient Name / Account</label>
                                                <input type="text" value={sendRecipient} onChange={e => setSendRecipient(e.target.value)} placeholder="e.g. Alex Smith" className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500" required />
                                            </div>

                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-400 mb-1">Amount (₹ INR)</label>
                                                    <input type="number" step="1" value={sendAmount} onChange={e => setSendAmount(e.target.value)} placeholder="5000" className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500" required />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-400 mb-1">Category</label>
                                                    <select value={sendCategory} onChange={e => setSendCategory(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                                                        <option>Transfer</option>
                                                        <option>Dining</option>
                                                        <option>Tech & Hosting</option>
                                                        <option>Shopping</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <button type="submit" disabled={isAuthorizing} className="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-blue-800 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/25 transition-all text-sm flex items-center justify-center space-x-2">
                                                <span>{isAuthorizing ? 'Checking AI Risk...' : 'Send Money Now'}</span>
                                                <Icon name="arrow-right" className="w-4 h-4" />
                                            </button>
                                        </form>
                                    </div>

                                    <div className="glass-card p-6 rounded-2xl text-center">
                                        <h4 className="text-sm font-bold text-white mb-2">UPI / QR Code Payment</h4>
                                        <p className="text-xs text-slate-400 mb-4">Scan code to pay instantly</p>
                                        <div className="w-32 h-32 mx-auto bg-white p-2 rounded-xl flex items-center justify-center shadow-inner">
                                            <div className="grid grid-cols-5 gap-1 w-full h-full bg-slate-900 p-1 rounded">
                                                <div className="bg-black"></div><div className="bg-black"></div><div className="bg-white"></div><div className="bg-black"></div><div className="bg-black"></div>
                                                <div className="bg-black"></div><div className="bg-white"></div><div className="bg-black"></div><div className="bg-white"></div><div className="bg-black"></div>
                                                <div className="bg-white"></div><div className="bg-black"></div><div className="bg-black"></div><div className="bg-black"></div><div className="bg-white"></div>
                                                <div className="bg-black"></div><div className="bg-white"></div><div className="bg-black"></div><div className="bg-white"></div><div className="bg-black"></div>
                                                <div className="bg-black"></div><div className="bg-black"></div><div className="bg-white"></div><div className="bg-black"></div><div className="bg-black"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="lg:col-span-2 glass-card p-6 rounded-2xl">
                                    <div className="flex items-center justify-between mb-6">
                                        <div>
                                            <h3 className="text-base font-bold text-white">Recent Transactions</h3>
                                            <p className="text-xs text-slate-400">All transfers checked by AI in real-time</p>
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="border-b border-slate-800 text-[11px] uppercase tracking-wider text-slate-400">
                                                    <th className="py-3 px-3">Txn ID</th>
                                                    <th className="py-3 px-3">Recipient</th>
                                                    <th className="py-3 px-3">Amount</th>
                                                    <th className="py-3 px-3">AI Risk Score</th>
                                                    <th className="py-3 px-3">Status</th>
                                                    <th className="py-3 px-3 text-right">Receipt</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-800/50 text-xs">
                                                {transactions.map(t => (
                                                    <tr key={t.id} className="hover:bg-slate-900/50 transition-all">
                                                        <td className="py-3 px-3 font-mono text-slate-300">{t.id}</td>
                                                        <td className="py-3 px-3">
                                                            <div className="font-semibold text-white">{t.recipient}</div>
                                                            <div className="text-[10px] text-slate-400">{t.category} • {t.date}</div>
                                                        </td>
                                                        <td className={`py-3 px-3 font-bold ${t.type === 'Credit' ? 'text-emerald-400' : 'text-slate-200'}`}>
                                                            {t.type === 'Credit' ? '+' : '-'}₹{t.amount.toLocaleString('en-IN', { minimumFractionDigits: 2 })}
                                                        </td>
                                                        <td className="py-3 px-3">
                                                            <span className={`inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold ${t.riskScore > 70 ? 'bg-red-500/10 text-red-400 border border-red-500/20' : (t.riskScore > 40 ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20')}`}>
                                                                {t.riskScore}/100 ({t.riskLevel})
                                                            </span>
                                                        </td>
                                                        <td className="py-3 px-3">
                                                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${t.status === 'Approved' ? 'bg-emerald-400/20 text-emerald-300' : (t.status === 'Requires 2FA' ? 'bg-amber-400/20 text-amber-300' : 'bg-red-400/20 text-red-300')}`}>
                                                                {t.status}
                                                            </span>
                                                        </td>
                                                        <td className="py-3 px-3 text-right">
                                                            <button onClick={() => setSelectedTxn(t)} className="text-blue-400 hover:text-blue-300 underline font-semibold">
                                                                View Receipt
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: ML FRAUD SCORING ENGINE */}
                        {activeTab === 'fraud' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                <div className="glass-card p-6 rounded-2xl">
                                    <h3 className="text-base font-bold text-white mb-2 flex items-center space-x-2">
                                        <Icon name="cpu" className="w-5 h-5 text-purple-400" />
                                        <span>Interactive AI Fraud Slider</span>
                                    </h3>
                                    <p className="text-xs text-slate-400 mb-6">Drag the sliders to see how AI calculates fraud risk!</p>

                                    <div className="space-y-5">
                                        <div>
                                            <div className="flex justify-between text-xs font-semibold mb-1">
                                                <span className="text-slate-300">1. Money Amount (₹ INR)</span>
                                                <span className="text-purple-400">₹{parseInt(mlAmount).toLocaleString('en-IN')}</span>
                                            </div>
                                            <input type="range" min="1000" max="500000" step="5000" value={mlAmount} onChange={e => { setMlAmount(e.target.value); handleCalculateRisk(e.target.value, mlVelocity, mlGeoDist); }} className="w-full accent-purple-500 bg-slate-900" />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs font-semibold mb-1">
                                                <span className="text-slate-300">2. Transfer Speed (Number of transfers in 60s)</span>
                                                <span className="text-purple-400">{mlVelocity} transfers</span>
                                            </div>
                                            <input type="range" min="1" max="10" value={mlVelocity} onChange={e => { setMlVelocity(e.target.value); handleCalculateRisk(mlAmount, e.target.value, mlGeoDist); }} className="w-full accent-purple-500 bg-slate-900" />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs font-semibold mb-1">
                                                <span className="text-slate-300">3. Distance from Home Location (km)</span>
                                                <span className="text-purple-400">{mlGeoDist} km</span>
                                            </div>
                                            <input type="range" min="0" max="1000" step="10" value={mlGeoDist} onChange={e => { setMlGeoDist(e.target.value); handleCalculateRisk(mlAmount, mlVelocity, e.target.value); }} className="w-full accent-purple-500 bg-slate-900" />
                                        </div>
                                    </div>

                                    <div className="mt-8 p-6 bg-slate-900/80 rounded-xl border border-slate-800 text-center">
                                        <p className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Calculated AI Fraud Risk</p>
                                        <div className="text-5xl font-black gradient-text my-2">{mlRiskScore} / 100</div>
                                        <p className="text-xs font-medium text-slate-300">
                                            Result: <span className={mlRiskScore > 70 ? "text-red-400 font-bold" : (mlRiskScore > 40 ? "text-amber-400 font-bold" : "text-emerald-400 font-bold")}>
                                                {mlRiskScore > 70 ? "HIGH RISK (BLOCKED)" : (mlRiskScore > 40 ? "MEDIUM RISK (REQUIRES OTP)" : "LOW RISK (APPROVED)")}
                                            </span>
                                        </p>
                                    </div>
                                </div>

                                <div className="glass-card p-6 rounded-2xl space-y-6">
                                    <h3 className="text-base font-bold text-white flex items-center space-x-2">
                                        <Icon name="layers" className="w-5 h-5 text-blue-400" />
                                        <span>How AI Decides Risk (Simple Rule)</span>
                                    </h3>
                                    
                                    <div className="space-y-4 text-xs">
                                        <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                                            <div className="font-bold text-white mb-1 text-sm">💡 Large Amounts (₹)</div>
                                            <p className="text-slate-400">Sending ₹1,00,000+ is much riskier than sending ₹500 for snacks.</p>
                                        </div>

                                        <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                                            <div className="font-bold text-white mb-1 text-sm">⚡ Speed & Frequency</div>
                                            <p className="text-slate-400">Sending 10 payments in 1 minute looks like a bot or hacker script.</p>
                                        </div>

                                        <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                                            <div className="font-bold text-white mb-1 text-sm">📍 Unexpected Distance</div>
                                            <p className="text-slate-400">If your account logs in from 1,000 km away in 2 seconds, AI flags it as suspicious location.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: AI FINANCIAL ADVISOR */}
                        {activeTab === 'ai' && (
                            <div className="max-w-3xl mx-auto glass-card rounded-2xl overflow-hidden flex flex-col h-[550px]">
                                <div className="p-4 border-b border-slate-800 bg-slate-900/60 flex items-center justify-between">
                                    <div className="flex items-center space-x-3">
                                        <div className="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                                            <Icon name="bot" className="w-5 h-5" />
                                        </div>
                                        <div>
                                            <h3 className="text-sm font-bold text-white">PaySphere AI Assistant</h3>
                                            <p className="text-[10px] text-emerald-400 font-medium">Ask questions in plain English!</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex-1 p-6 overflow-y-auto space-y-4">
                                    {chatMessages.map((msg, i) => (
                                        <div key={i} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[80%] rounded-2xl p-4 text-xs leading-relaxed ${msg.sender === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-none'}`}>
                                                {msg.text}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <form onSubmit={handleSendMessage} className="p-4 border-t border-slate-800 bg-slate-900/40 flex space-x-3">
                                    <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="Ask: 'Why was my payment flagged?' or 'How does AI check fraud?'" className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500" />
                                    <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl font-bold text-xs transition-all flex items-center space-x-1">
                                        <span>Ask</span>
                                        <Icon name="send" className="w-3.5 h-3.5" />
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* TAB 4: SYSTEM METRICS */}
                        {activeTab === 'analytics' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div className="glass-card p-6 rounded-2xl">
                                    <p className="text-xs font-semibold text-slate-400">System Speed</p>
                                    <h4 className="text-3xl font-black text-white my-2">1,482 TPS</h4>
                                    <p className="text-xs text-emerald-400">Processes 1,482 transactions per second</p>
                                </div>

                                <div className="glass-card p-6 rounded-2xl">
                                    <p className="text-xs font-semibold text-slate-400">AI Response Time</p>
                                    <h4 className="text-3xl font-black text-purple-400 my-2">18.4 ms</h4>
                                    <p className="text-xs text-slate-400">Super fast (under 20 milliseconds)</p>
                                </div>

                                <div className="glass-card p-6 rounded-2xl">
                                    <p className="text-xs font-semibold text-slate-400">Fraud Accuracy</p>
                                    <h4 className="text-3xl font-black text-amber-400 my-2">99.4%</h4>
                                    <p className="text-xs text-emerald-400">Catches almost 100% of fake transfers</p>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Receipt Modal */}
                    {selectedTxn && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="glass-card bg-slate-900 border border-slate-700 max-w-md w-full p-6 rounded-2xl text-white space-y-4">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="font-bold text-sm">Official Transaction Receipt</h3>
                                    <button onClick={() => setSelectedTxn(null)} className="text-slate-400 hover:text-white">✕</button>
                                </div>

                                <div className="space-y-2 text-xs">
                                    <div className="flex justify-between"><span className="text-slate-400">Receipt ID:</span><span className="font-mono font-bold">{selectedTxn.id}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">Timestamp:</span><span>{selectedTxn.date}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">Recipient:</span><span className="font-bold">{selectedTxn.recipient}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">Category:</span><span>{selectedTxn.category}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">Amount Paid:</span><span className="font-bold text-emerald-400">₹{selectedTxn.amount.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">AI Risk Score:</span><span>{selectedTxn.riskScore}/100</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">Status:</span><span className="font-bold text-emerald-400">{selectedTxn.status}</span></div>
                                </div>

                                <div className="pt-4 border-t border-slate-800 flex space-x-3">
                                    <button onClick={() => window.print()} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-xl text-xs">
                                        Print / Save PDF
                                    </button>
                                    <button onClick={() => setSelectedTxn(null)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs">
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Easy Student Guide Modal */}
                    {showGuideModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="glass-card bg-slate-900 border border-purple-500/30 max-w-xl w-full p-6 rounded-2xl text-white space-y-4 max-h-[85vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="font-bold text-base text-purple-400 flex items-center space-x-2">
                                        <Icon name="book-open" className="w-5 h-5" />
                                        <span>🎓 Student Guide: Understanding PaySphere</span>
                                    </h3>
                                    <button onClick={() => setShowGuideModal(false)} className="text-slate-400 hover:text-white">✕</button>
                                </div>

                                <div className="space-y-4 text-xs leading-relaxed text-slate-300">
                                    <div className="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700">
                                        <h4 className="font-bold text-white mb-1">1. What is PaySphere?</h4>
                                        <p>PaySphere is a digital wallet application (like Paytm, PhonePe, or Google Pay) that has an <strong>Artificial Intelligence (AI) Fraud Detector</strong> built-in. Every time money is transferred, AI checks if the transaction is safe or a scam!</p>
                                    </div>

                                    <div className="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700">
                                        <h4 className="font-bold text-white mb-1">2. How to test it right now?</h4>
                                        <ul className="list-disc pl-4 space-y-1">
                                            <li><strong>Tab 1 (Send Money)</strong>: Type a recipient name and amount in ₹, click <em>Send Money Now</em>.</li>
                                            <li><strong>Tab 2 (AI Fraud Slider)</strong>: Drag the sliders to see how high amounts and fast speeds raise the Fraud Risk Index!</li>
                                            <li><strong>Tab 3 (AI Chat)</strong>: Ask the chatbot questions like <em>"Why was my transfer flagged?"</em></li>
                                        </ul>
                                    </div>

                                    <div className="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700">
                                        <h4 className="font-bold text-white mb-1">3. How does AI calculate Fraud Risk?</h4>
                                        <p>It checks 3 main factors:</p>
                                        <ol className="list-decimal pl-4 space-y-0.5 mt-1">
                                            <li><strong>Amount (₹)</strong>: Sending ₹1,00,000+ is riskier than ₹200.</li>
                                            <li><strong>Speed (Velocity)</strong>: Sending 10 transfers in 1 minute looks like a bot attack.</li>
                                            <li><strong>Location Distance</strong>: Logging in from 500 km away triggers suspicion.</li>
                                        </ol>
                                    </div>

                                    <div className="bg-purple-900/30 p-3.5 rounded-xl border border-purple-500/30 text-purple-200">
                                        <h4 className="font-bold text-purple-300 mb-1">💡 Simple Viva Answer for Students:</h4>
                                        <p><em>"PaySphere is a full-stack digital wallet built using React and Python FastAPI. It evaluates transaction risk in under 20 milliseconds using an Isolation Forest Machine Learning model."</em></p>
                                    </div>
                                </div>

                                <div className="pt-2">
                                    <button onClick={() => setShowGuideModal(false)} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl text-xs">
                                        Got It! Close Guide
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
