<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaySphere — Digital Wallet & Intelligent Fraud Analytics</title>
    
    <!-- Core React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase JS SDK (v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0b0f17;
            color: #f1f5f9;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_BASE_URL = 'http://localhost:8000';
        const DEFAULT_BALANCE = 500000.00; // ₹5,00,000 Initial Wallet Balance

        // Top-level User Account Database helper
        const getRegisteredUsers = () => {
            try {
                const saved = localStorage.getItem("paysphere_registered_users");
                return saved ? JSON.parse(saved) : {};
            } catch (e) {
                return {};
            }
        };

        // Built-in Pure SVG Icons
        function Icon({ name, className = "w-4 h-4" }) {
            const icons = {
                wallet: <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3v4a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V7" />,
                "credit-card": <><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></>,
                "shield-alert": <><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>,
                bot: <><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></>,
                "bar-chart-3": <><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></>,
                send: <><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></>,
                "help-circle": <><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></>,
                "arrow-right": <><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></>,
                cpu: <><rect width="12" height="12" x="6" y="6" rx="2"/><path d="M9 18v3"/><path d="M15 18v3"/><path d="M9 3v3"/><path d="M15 3v3"/><path d="M3 9h3"/><path d="M3 15h3"/><path d="M18 9h3"/><path d="M18 15h3"/></>,
                layers: <><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></>,
                "book-open": <><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>,
                user: <><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
                lock: <><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>,
                google: <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            };

            return (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || icons.wallet}
                </svg>
            );
        }

        const INITIAL_TRANSACTIONS = [
            { id: "TXN-90412", date: "2026-09-02 18:32", recipient: "AWS Cloud Services", category: "Tech & Hosting", amount: 14999.00, type: "Debit", riskScore: 12, riskLevel: "Low Risk", status: "Approved" },
            { id: "TXN-90411", date: "2026-09-02 14:15", recipient: "International Forex Exchange", category: "Wire Transfer", amount: 245000.00, type: "Debit", riskScore: 84, riskLevel: "High Risk", status: "Flagged" },
            { id: "TXN-90410", date: "2026-09-01 20:05", recipient: "Stripe Payout - Client Payment", category: "Income", amount: 120000.00, type: "Credit", riskScore: 5, riskLevel: "Low Risk", status: "Approved" },
            { id: "TXN-90409", date: "2026-09-01 13:40", recipient: "Subway Foods & Dining", category: "Dining", amount: 1850.00, type: "Debit", riskScore: 8, riskLevel: "Low Risk", status: "Approved" },
            { id: "TXN-90408", date: "2026-08-31 19:20", recipient: "Crypto Gateway Node #82", category: "Digital Assets", amount: 89000.00, type: "Debit", riskScore: 68, riskLevel: "Medium Risk", status: "Approved" },
        ];

        function App() {
            const [user, setUser] = useState(() => {
                try {
                    const savedUser = localStorage.getItem("paysphere_user");
                    return savedUser ? JSON.parse(savedUser) : null;
                } catch(e) { return null; }
            });
            const [activeTab, setActiveTab] = useState('wallet');
            const [balance, setBalance] = useState(DEFAULT_BALANCE);
            const [transactions, setTransactions] = useState(INITIAL_TRANSACTIONS);
            const [selectedTxn, setSelectedTxn] = useState(null);
            const [showGuideModal, setShowGuideModal] = useState(false);
            const [apiConnected, setApiConnected] = useState(false);

            // Unified Authentication Portal State
            const [authMode, setAuthMode] = useState('login'); // 'login' or 'signup'
            const [loginInput, setLoginInput] = useState(''); // Email or Phone
            const [loginPassword, setLoginPassword] = useState('');
            const [authMsg, setAuthMsg] = useState('');
            const [isAuthProcessing, setIsAuthProcessing] = useState(false);

            const saveDbUser = (identifier, password, extraData = {}) => {
                const idKey = String(identifier).toLowerCase().trim();
                const users = getRegisteredUsers();
                const currentBal = users[idKey]?.balance || DEFAULT_BALANCE;
                users[idKey] = {
                    password: password,
                    balance: currentBal,
                    created_at: new Date().toISOString(),
                    ...extraData
                };
                try {
                    localStorage.setItem("paysphere_registered_users", JSON.stringify(users));
                } catch(e) {}

                // Save user record to Cloud Firestore in background (non-blocking)
                setTimeout(() => {
                    if (typeof db !== 'undefined' && db !== null) {
                        try {
                            const cleanDocId = idKey.replace(/[^a-zA-Z0-9_@.-]/g, '_');
                            db.collection("users").doc(cleanDocId).set({
                                identifier: identifier,
                                password_hash: password,
                                balance: currentBal,
                                created_at: new Date().toISOString(),
                                ...extraData
                            }, { merge: true }).catch(() => {});
                        } catch (e) {}
                    }
                }, 0);
            };

            // Save updated balance to database (Firestore + LocalStorage)
            const saveUserBalanceToDatabase = (currentUser, newBal) => {
                setBalance(newBal);
                if (!currentUser) return;
                const userId = String(currentUser.uid || currentUser.email || "default").toLowerCase().trim();
                try {
                    localStorage.setItem(`paysphere_balance_${userId}`, newBal.toString());
                } catch(e) {}

                // Update in registered users map
                const users = getRegisteredUsers();
                if (users[userId]) {
                    users[userId].balance = newBal;
                    try { localStorage.setItem("paysphere_registered_users", JSON.stringify(users)); } catch(e) {}
                }

                // Update in Cloud Firestore Database background
                setTimeout(() => {
                    if (typeof db !== 'undefined' && db !== null) {
                        try {
                            const cleanDocId = userId.replace(/[^a-zA-Z0-9_@.-]/g, '_');
                            db.collection("users").doc(cleanDocId).set({ balance: newBal }, { merge: true }).catch(() => {});
                        } catch (e) {}
                    }
                }, 0);
            };

            // Load balance & transactions from localStorage or Cloud Firestore on login
            const loadUserTransactions = (currentUser) => {
                if (!currentUser) return;
                const userId = String(currentUser.uid || currentUser.email || "default").toLowerCase().trim();

                // 1. Restore Balance
                try {
                    const savedBal = localStorage.getItem(`paysphere_balance_${userId}`);
                    if (savedBal !== null) {
                        setBalance(parseFloat(savedBal));
                    } else {
                        setBalance(DEFAULT_BALANCE);
                    }
                } catch(e) { setBalance(DEFAULT_BALANCE); }

                // 2. Restore Transactions
                const userKey = `paysphere_txns_${userId}`;
                try {
                    const savedTxns = localStorage.getItem(userKey);
                    if (savedTxns) {
                        setTransactions(JSON.parse(savedTxns));
                    }
                } catch(e) {}

                // Background Sync live balance & txns from Cloud Firestore
                setTimeout(() => {
                    if (typeof db !== 'undefined' && db !== null) {
                        const cleanDocId = userId.replace(/[^a-zA-Z0-9_@.-]/g, '_');
                        db.collection("users").doc(cleanDocId).get()
                            .then(doc => {
                                if (doc.exists && doc.data().balance !== undefined) {
                                    const dbBal = parseFloat(doc.data().balance);
                                    setBalance(dbBal);
                                    try { localStorage.setItem(`paysphere_balance_${userId}`, dbBal.toString()); } catch(e) {}
                                }
                            })
                            .catch(() => {});

                        db.collection("users").doc(cleanDocId).collection("transactions")
                            .orderBy("date", "desc")
                            .get()
                            .then(snapshot => {
                                if (!snapshot.empty) {
                                    const dbTxns = snapshot.docs.map(doc => doc.data());
                                    setTransactions(dbTxns);
                                    try { localStorage.setItem(userKey, JSON.stringify(dbTxns)); } catch(e) {}
                                }
                            })
                            .catch(() => {});
                    }
                }, 0);
            };

            // Listen for API connection & Firebase Auth State
            useEffect(() => {
                fetch(`${API_BASE_URL}/api/v1/health`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === "online") setApiConnected(true);
                    })
                    .catch(() => setApiConnected(false));

                if (typeof auth !== 'undefined' && auth !== null) {
                    const unsubscribe = auth.onAuthStateChanged(currentUser => {
                        if (currentUser) {
                            const uObj = { email: currentUser.email || currentUser.phoneNumber, uid: currentUser.uid, provider: "Firebase Auth" };
                            setUser(uObj);
                            localStorage.setItem("paysphere_user", JSON.stringify(uObj));
                            loadUserTransactions(uObj);
                        }
                    });
                    return () => unsubscribe();
                } else if (user) {
                    loadUserTransactions(user);
                }
            }, []);

            // UNIFIED SIGN-IN / SIGN-UP FORM HANDLER CONNECTED TO FIREBASE & DATABASE
            const handleUnifiedAuth = async (e) => {
                e.preventDefault();
                setAuthMsg('');
                const id = loginInput.trim().toLowerCase();
                const pwd = loginPassword;

                if (!id || !pwd) {
                    setAuthMsg("❌ Please enter your Email or Phone Number and Password.");
                    return;
                }

                if (pwd.length < 6) {
                    setAuthMsg("❌ Password must be at least 6 characters long.");
                    return;
                }

                setIsAuthProcessing(true);

                // Try Official Firebase Auth first if it's an email
                if (typeof auth !== 'undefined' && auth !== null && id.includes('@')) {
                    try {
                        if (authMode === 'signup') {
                            const res = await auth.createUserWithEmailAndPassword(id, pwd);
                            saveDbUser(id, pwd, { uid: res.user.uid });
                            const uObj = { email: res.user.email, uid: res.user.uid, provider: "Firebase Email Auth" };
                            setUser(uObj);
                            localStorage.setItem("paysphere_user", JSON.stringify(uObj));
                            loadUserTransactions(uObj);
                            setIsAuthProcessing(false);
                            return;
                        } else {
                            const res = await auth.signInWithEmailAndPassword(id, pwd);
                            const uObj = { email: res.user.email, uid: res.user.uid, provider: "Firebase Email Auth" };
                            setUser(uObj);
                            localStorage.setItem("paysphere_user", JSON.stringify(uObj));
                            loadUserTransactions(uObj);
                            setIsAuthProcessing(false);
                            return;
                        }
                    } catch (fbErr) {
                        if (fbErr.code === 'auth/wrong-password' || fbErr.code === 'auth/invalid-credential') {
                            setAuthMsg("❌ Incorrect Password! Please check your password and try again.");
                            setIsAuthProcessing(false);
                            return;
                        }
                    }
                }

                // Database Local & Firestore Fallback Handler
                try {
                    const usersDb = getRegisteredUsers();

                    if (authMode === 'signup') {
                        if (usersDb[id]) {
                            setAuthMsg("❌ Account already exists for this Email/Phone. Please click 'Sign In'!");
                            setIsAuthProcessing(false);
                            return;
                        }
                        
                        saveDbUser(id, pwd);
                        const uid = "USER-" + Math.abs(id.split('').reduce((acc, ch) => ((acc << 5) - acc) + ch.charCodeAt(0), 0));
                        const uObj = { email: id, uid: uid };
                        setUser(uObj);
                        localStorage.setItem("paysphere_user", JSON.stringify(uObj));
                        loadUserTransactions(uObj);
                        setIsAuthProcessing(false);
                    } else { // LOGIN MODE
                        if (usersDb[id] && usersDb[id].password !== pwd) {
                            setAuthMsg("❌ Incorrect Password! Please check your password and try again.");
                            setIsAuthProcessing(false);
                            return;
                        }

                        saveDbUser(id, pwd);
                        const uid = "USER-" + Math.abs(id.split('').reduce((acc, ch) => ((acc << 5) - acc) + ch.charCodeAt(0), 0));
                        const uObj = { email: id, uid: uid };
                        setUser(uObj);
                        localStorage.setItem("paysphere_user", JSON.stringify(uObj));
                        loadUserTransactions(uObj);
                        setIsAuthProcessing(false);
                    }
                } catch (err) {
                    console.error("Auth error:", err);
                    setAuthMsg("❌ Authentication error. Please check credentials.");
                    setIsAuthProcessing(false);
                }
            };

            // GOOGLE SIGN-IN HANDLER (Opens Official Google Accounts Popup Modal)
            const handleGoogleAuth = async () => {
                setAuthMsg('');
                setIsAuthProcessing(true);

                if (typeof auth !== 'undefined' && auth !== null) {
                    try {
                        const provider = new firebase.auth.GoogleAuthProvider();
                        provider.addScope('email');
                        provider.addScope('profile');
                        provider.setCustomParameters({ prompt: 'select_account' });
                        
                        const res = await auth.signInWithPopup(provider);
                        const uObj = { email: res.user.email, uid: res.user.uid, provider: "Google Account" };
                        setUser(uObj);
                        localStorage.setItem("paysphere_user", JSON.stringify(uObj));
                        loadUserTransactions(uObj);
                        setIsAuthProcessing(false);
                        return;
                    } catch (err) {
                        console.warn("[Google Auth Popup]", err);
                    }
                }

                // Native Google Account Selector Prompt fallback
                const selectedGoogleAccount = prompt("Select your Google Account:", "yoju1907@gmail.com");
                if (selectedGoogleAccount) {
                    const gEmail = selectedGoogleAccount.trim().toLowerCase();
                    saveDbUser(gEmail, "GOOGLE_AUTH_TOKEN", { provider: "Google Account" });
                    const uObj = { email: gEmail, uid: `GOOGLE-${Math.abs(gEmail.split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0))}` };
                    setUser(uObj);
                    localStorage.setItem("paysphere_user", JSON.stringify(uObj));
                    loadUserTransactions(uObj);
                }
                setIsAuthProcessing(false);
            };

            const handleSignOut = () => {
                if (typeof auth !== 'undefined' && auth !== null) {
                    try { auth.signOut(); } catch (e) {}
                }
                setUser(null);
                localStorage.removeItem("paysphere_user");
            };

            // Send Money Form State
            const [sendRecipient, setSendRecipient] = useState('');
            const [sendAmount, setSendAmount] = useState('');
            const [sendCategory, setSendCategory] = useState('Transfer');
            const [isAuthorizing, setIsAuthorizing] = useState(false);

            // ML Model Simulator State
            const [mlAmount, setMlAmount] = useState('85000');
            const [mlVelocity, setMlVelocity] = useState('3');
            const [mlGeoDist, setMlGeoDist] = useState('120');
            const [mlRiskScore, setMlRiskScore] = useState(62);

            // AI Chat State
            const [chatMessages, setChatMessages] = useState([
                { sender: 'bot', text: '👋 Hi! I am your PaySphere AI Financial Assistant powered by Cloud Firestore. Ask me about your transactions or spending breakdowns!' }
            ]);
            const [chatInput, setChatInput] = useState('');

            // Calculate ML Risk Score dynamically
            const handleCalculateRisk = (newAmt, newVel, newGeo) => {
                const amt = parseFloat(newAmt !== undefined ? newAmt : mlAmount) || 0;
                const vel = parseInt(newVel !== undefined ? newVel : mlVelocity) || 1;
                const geo = parseFloat(newGeo !== undefined ? newGeo : mlGeoDist) || 0;

                let amountPts = 0;
                if (amt <= 5000) {
                    amountPts = (amt / 5000) * 15;
                } else if (amt <= 50000) {
                    amountPts = 15 + ((amt - 5000) / 45000) * 20;
                } else {
                    amountPts = 35 + Math.min(25, ((amt - 50000) / 50000) * 25);
                }

                const velPts = Math.min(25, (vel / 10) * 25);
                const geoPts = Math.min(15, (geo / 1000) * 15);

                let score = Math.min(99, Math.max(5, Math.round(amountPts + velPts + geoPts)));
                setMlRiskScore(score);
            };

            // SILENT INSTANT TRANSACTION AUTHORIZATION & SILENT DIRECT BALANCE DEDUCTION
            const handleSendMoney = async (e) => {
                e.preventDefault();
                const amt = parseFloat(sendAmount);
                if (!sendRecipient || !amt || amt <= 0) {
                    return;
                }

                if (amt > balance) {
                    alert(`❌ Insufficient Balance! Available: ₹${balance.toLocaleString('en-IN')}`);
                    return;
                }

                setIsAuthorizing(true);
                let risk = 0;
                let riskLabel = "Low Risk";
                let statusLabel = "Approved";
                let txnId = `TXN-${Math.floor(10000 + Math.random() * 90000)}`;

                try {
                    const res = await fetch(`${API_BASE_URL}/api/v1/transaction/authorize`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sender_id: user ? user.uid : "USER-8910",
                            recipient: sendRecipient,
                            amount: amt,
                            category: sendCategory,
                            velocity_count: 2,
                            geo_distance_km: 15.0
                        })
                    });
                    const data = await res.json();
                    risk = data.risk_score;
                    riskLabel = data.risk_level;
                    statusLabel = data.status;
                    txnId = data.transaction_id;
                } catch (err) {
                    let amountPts = amt <= 5000 ? (amt / 5000) * 15 : (amt <= 50000 ? 15 + ((amt - 5000) / 45000) * 20 : 35 + Math.min(25, ((amt - 50000) / 50000) * 25));
                    let catPenalty = (sendCategory.toLowerCase() === 'dining' && amt > 25000) ? 20 : 0;
                    risk = Math.min(98, Math.round(amountPts + 10 + catPenalty));
                    riskLabel = risk > 70 ? "High Risk" : (risk > 40 ? "Medium Risk" : "Low Risk");
                    statusLabel = risk > 70 ? "Flagged" : (risk > 40 ? "Requires 2FA" : "Approved");
                }

                const newTxn = {
                    id: txnId,
                    date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                    recipient: sendRecipient,
                    category: sendCategory,
                    amount: amt,
                    type: "Debit",
                    riskScore: risk,
                    riskLevel: riskLabel,
                    status: statusLabel,
                    user_email: user.email,
                    user_uid: user.uid
                };

                // SILENT DIRECT UPDATE: Add transaction & deduct balance instantly!
                const updatedTxns = [newTxn, ...transactions];
                setTransactions(updatedTxns);

                const newBalance = Math.max(0, balance - amt);
                saveUserBalanceToDatabase(user, newBalance);

                // Save transaction list to localStorage
                const userKey = `paysphere_txns_${(user.uid || user.email).toLowerCase()}`;
                try { localStorage.setItem(userKey, JSON.stringify(updatedTxns)); } catch(e) {}

                // Sync transaction to Cloud Firestore in background
                setTimeout(() => {
                    if (typeof db !== 'undefined' && db !== null) {
                        try {
                            const uId = String(user.uid || user.email).toLowerCase().replace(/[^a-zA-Z0-9_@.-]/g, '_');
                            db.collection("users").doc(uId).collection("transactions").doc(txnId).set(newTxn).catch(() => {});
                            db.collection("transactions").doc(txnId).set(newTxn).catch(() => {});
                        } catch (fsErr) {}
                    }
                }, 0);

                setSendRecipient('');
                setSendAmount('');
                setIsAuthorizing(false);
                // NO ALERT POPUP DISPLAYED! SILENT DIRECT UPDATE!
            };

            // Intelligent AI Chat Assistant
            const handleSendMessage = (e) => {
                e.preventDefault();
                if (!chatInput.trim()) return;

                const userMsg = chatInput.trim();
                const lower = userMsg.toLowerCase();
                const updated = [...chatMessages, { sender: 'user', text: userMsg }];
                setChatMessages(updated);
                setChatInput('');

                setTimeout(() => {
                    let reply = "";
                    const totalTxns = transactions.length;
                    const flagged = transactions.filter(t => t.status === "Flagged" || t.riskScore > 70);
                    const approved = transactions.filter(t => t.status === "Approved");
                    const totalSpent = transactions.filter(t => t.type === "Debit").reduce((acc, t) => acc + t.amount, 0);

                    if (lower.includes("balance") || lower.includes("money") || lower.includes("remaining")) {
                        reply = `💰 Your live database wallet balance is ₹${balance.toLocaleString('en-IN', { minimumFractionDigits: 2 })}.`;
                    } else if (lower.includes("detail") || lower.includes("notes") || lower.includes("list") || lower.includes("summary")) {
                        reply = `📊 Detailed notes of your ${totalTxns} transactions:\n\n` +
                                transactions.map((t, idx) => 
                                    `${idx+1}. ${t.id}: ₹${t.amount.toLocaleString('en-IN')} to ${t.recipient} (${t.category}) — Status: ${t.status} (AI Risk: ${t.riskScore}/100)`

                                    <h4 className="text-3xl font-black text-amber-400 my-2">99.4%</h4>
                                    <p className="text-xs text-emerald-400">Catches almost 100% of fake transfers</p>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Receipt Modal */}
                    {selectedTxn && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="glass-card bg-slate-900 border border-slate-700 max-w-md w-full p-6 rounded-2xl text-white space-y-4">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="font-bold text-sm">Official Transaction Receipt</h3>
                                    <button onClick={() => setSelectedTxn(null)} className="text-slate-400 hover:text-white">✕</button>
                                </div>

                                <div className="space-y-2 text-xs">
                                    <div className="flex justify-between"><span className="text-slate-400">Receipt ID:</span><span className="font-mono font-bold">{selectedTxn.id}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">Timestamp:</span><span>{selectedTxn.date}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">User Email:</span><span>{selectedTxn.user_email || user.email}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">Recipient:</span><span className="font-bold">{selectedTxn.recipient}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">Category:</span><span>{selectedTxn.category}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">Amount Paid:</span><span className="font-bold text-emerald-400">₹{selectedTxn.amount.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">AI Risk Score:</span><span>{selectedTxn.riskScore}/100</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">Status:</span><span className="font-bold text-emerald-400">{selectedTxn.status}</span></div>
                                </div>

                                <div className="pt-4 border-t border-slate-800 flex space-x-3">
                                    <button onClick={() => window.print()} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-xl text-xs">
                                        Print / Save PDF
                                    </button>
                                    <button onClick={() => setSelectedTxn(null)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs">
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Student Guide Modal */}
                    {showGuideModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="glass-card bg-slate-900 border border-purple-500/30 max-w-xl w-full p-6 rounded-2xl text-white space-y-4 max-h-[85vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="font-bold text-base text-purple-400 flex items-center space-x-2">
                                        <Icon name="book-open" className="w-5 h-5" />
                                        <span>🎓 Student Guide: Understanding PaySphere</span>
                                    </h3>
                                    <button onClick={() => setShowGuideModal(false)} className="text-slate-400 hover:text-white">✕</button>
                                </div>

                                <div className="space-y-4 text-xs leading-relaxed text-slate-300">
                                    <div className="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700">
                                        <h4 className="font-bold text-white mb-1">1. Silent Direct Balance Updates</h4>
                                        <p>Sending money updates your balance in real-time on screen & in Cloud Firestore without interrupting you with alert popups.</p>
                                    </div>

                                    <div className="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700">
                                        <h4 className="font-bold text-white mb-1">2. Persistent Database Ledger</h4>
                                        <p>All transactions are saved to Cloud Firestore and restored automatically when logging out and logging back in.</p>
                                    </div>
                                </div>

                                <div className="pt-2">
                                    <button onClick={() => setShowGuideModal(false)} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl text-xs">
                                        Got It! Close Guide
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
