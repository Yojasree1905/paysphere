</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_BASE_URL = 'http://localhost:8000';
        const INITIAL_SEED_BALANCE = 500000.00;

        // ACCURATE TIME PARSER & IST FORMATTER FOR CHRONOLOGICAL SORTING
        const getTxnTime = (item) => {
            if (!item) return 0;
            if (item.timestamp && !isNaN(item.timestamp)) {
                return Number(item.timestamp);
            }
            if (item.date) {
                const cleanDateStr = String(item.date).replace(" IST", "");
                const parsed = Date.parse(cleanDateStr);
                if (!isNaN(parsed)) return parsed;
            }
            return 0;
        };

        const formatISTDate = (item) => {
            const timeMs = getTxnTime(item);
            if (!timeMs) return item.date || "N/A";
            const d = new Date(timeMs);
            const options = {
                timeZone: 'Asia/Kolkata',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            };
            const parts = new Intl.DateTimeFormat('en-CA', options).formatToParts(d);
            const hash = {};
            parts.forEach(p => hash[p.type] = p.value);
            return `${hash.year}-${hash.month}-${hash.day} ${hash.hour}:${hash.minute} IST`;
        };

        const getIndianTimestamp = () => {
            return formatISTDate({ timestamp: Date.now() });
        };

        const sortTransactionsIST = (txnsList) => {
            return [...txnsList].sort((a, b) => getTxnTime(b) - getTxnTime(a));
        };

        // DEFAULT SEED DEMO TRANSACTIONS (USED ONLY FOR BRAND NEW ACCOUNTS)
        const DEFAULT_DEMO_TXNS = sortTransactionsIST([
            { id: "TXN-98406", timestamp: new Date("2026-08-28T19:13:00+05:30").getTime(), date: "2026-08-28 19:13 IST", recipient: "Subway Gourmet Dining", category: "Dining", amount: 1850.00, type: "Debit", riskProfile: "Low Risk", securityStatus: "✅ Low Risk (Verified)", status: "Completed", riskScore: 8 },
            { id: "TXN-98405", timestamp: new Date("2026-08-27T18:47:00+05:30").getTime(), date: "2026-08-27 18:47 IST", recipient: "Global Exchange Node", category: "Wire Transfer", amount: 245000.00, type: "Debit", riskProfile: "High Risk", securityStatus: "⚠️ High Risk (Flagged)", status: "Flagged", riskScore: 88 },
        ]);

        const Icon = ({ name, className = "w-5 h-5" }) => {
            switch (name) {
                case 'wallet':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>;
                case 'credit-card':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>;
                case 'shield':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>;
                case 'plus':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>;
                case 'cpu':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M3 9h2m-2 6h2m14-6h2m-2 6h2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/></svg>;
                case 'bot':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M3 9h2m-2 6h2m14-6h2m-2 6h2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/></svg>;
                case 'chart':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>;
                case 'send':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>;
                case 'qr':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v1m0 4v1m0 4v1m0 4v1m-4-13h1m-1 4h1m-1 4h1m-1 4h1m8-13h1m-1 4h1m-1 4h1m-1 4h1M4 4h4v4H4V4zm0 12h4v4H4v-4zm12-12h4v4h-4V4zm12 12h4v4h-4v-4z"/></svg>;
                case 'lock':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>;
                case 'arrow-right':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>;
                case 'google':
                    return <svg className={className} viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>;
                default:
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
            }
        };

        function App() {
            const [user, setUser] = useState(() => {
                try {
                    const savedUser = localStorage.getItem("paysphere_user");
                    return savedUser ? JSON.parse(savedUser) : null;
                } catch(e) { return null; }
            });

            const [activeTab, setActiveTab] = useState('payments');
            const [balance, setBalance] = useState(INITIAL_SEED_BALANCE);
            const [transactions, setTransactions] = useState([]);
            const [selectedTxn, setSelectedTxn] = useState(null);

            // Auth Portal States
            const [authMode, setAuthMode] = useState('login');
            const [loginInput, setLoginInput] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [authMsg, setAuthMsg] = useState('');
            const [isAuthProcessing, setIsAuthProcessing] = useState(false);

            // Payment Form State
            const [recipient, setRecipient] = useState('');
            const [amount, setAmount] = useState('');
            const [category, setCategory] = useState('Transfer');
            const [transferType, setTransferType] = useState('UPI');
            const [paymentNotice, setPaymentNotice] = useState(null);

            // Add Money State
            const [topUpAmount, setTopUpAmount] = useState('');
            const [topUpSource, setTopUpSource] = useState('UPI / Bank Transfer');
            const [topUpNotice, setTopUpNotice] = useState(null);

            // AI Fraud Risk Range Sliders State
            const [simAmount, setSimAmount] = useState('85000');
            const [simVelocity, setSimVelocity] = useState('3');
            const [simDistance, setSimDistance] = useState('120');
            const [simRiskScore, setSimRiskScore] = useState(62);

            // 2FA Modal State
            const [show2FAModal, setShow2FAModal] = useState(false);
            const [pendingTransaction, setPendingTransaction] = useState(null);
            const [otpValues, setOtpValues] = useState(['', '', '', '', '', '']);
            const [otpError, setOtpError] = useState('');

            // AI Chat State
            const [chatMessages, setChatMessages] = useState([
                { sender: 'assistant', text: 'Hello! I am your PaySphere Personal Financial Advisor. How can I assist your wallet management today?' }
            ]);
            const [chatInput, setChatInput] = useState('');

            const calculateSimulatedRisk = (amtVal, velVal, distVal) => {
                const amt = parseFloat(amtVal !== undefined ? amtVal : simAmount) || 0;
                const vel = parseInt(velVal !== undefined ? velVal : simVelocity) || 1;
                const dist = parseFloat(distVal !== undefined ? distVal : simDistance) || 0;

                let amountPts = amt <= 5000 ? (amt / 5000) * 15 : (amt <= 50000 ? 15 + ((amt - 5000) / 45000) * 20 : 35 + Math.min(25, ((amt - 50000) / 50000) * 25));
                let velPts = Math.min(25, (vel / 10) * 25);
                let distPts = Math.min(15, (dist / 1000) * 15);

                let totalScore = Math.min(99, Math.max(5, Math.round(amountPts + velPts + distPts)));
                setSimRiskScore(totalScore);
            };

            const syncUserToFirestore = (uId, emailStr, userBal) => {
                if (typeof db !== 'undefined' && db !== null) {
                    const cleanDocId = String(uId || emailStr).toLowerCase().replace(/[^a-zA-Z0-9_@.-]/g, '_');
                    db.collection("users").doc(cleanDocId).set({
                        uid: uId,
                        email: emailStr,
                        balance: userBal,
                        created_at: getIndianTimestamp(),
                        last_active: getIndianTimestamp()
                    }, { merge: true }).catch(err => console.error("[Firestore Error]", err));
                }
            };

            const updateBalanceInDatabase = (currentUser, newBal) => {
                setBalance(newBal);
                if (!currentUser) return;
                const userId = String(currentUser.uid || currentUser.email || "default").toLowerCase().trim();
                const cleanDocId = userId.replace(/[^a-zA-Z0-9_@.-]/g, '_');

                try { localStorage.setItem(`paysphere_balance_${cleanDocId}`, newBal.toString()); } catch(e) {}

                if (typeof db !== 'undefined' && db !== null) {
                    db.collection("users").doc(cleanDocId).set({
                        balance: newBal,
                        last_updated: getIndianTimestamp()
                    }, { merge: true }).catch(() => {});
                }

                if (typeof rtdb !== 'undefined' && rtdb !== null) {
                    try {
                        rtdb.ref(`users/${cleanDocId}/balance`).set(newBal).catch(() => {});
                    } catch (e) {}
                }
            };

            // STRICT ACCOUNT ISOLATION EFFECT
            useEffect(() => {
                if (!user) return;
                const userId = String(user.uid || user.email || "default").toLowerCase().trim();
                const cleanDocId = userId.replace(/[^a-zA-Z0-9_@.-]/g, '_');
                const userKey = `paysphere_txns_${cleanDocId}`;
                const balKey = `paysphere_balance_${cleanDocId}`;

                // 1. Fetch cached per-user balance
                let currentBal = INITIAL_SEED_BALANCE;
                try {
                    const savedBal = localStorage.getItem(balKey);
                    if (savedBal !== null && !isNaN(parseFloat(savedBal))) {
                        currentBal = parseFloat(savedBal);
                        setBalance(currentBal);
                    } else {
                        setBalance(INITIAL_SEED_BALANCE);
                    }
                } catch(e) {}

                // 2. Fetch cached per-user transactions
                try {
                    const savedTxns = localStorage.getItem(userKey);
                    if (savedTxns) {
                        const parsed = JSON.parse(savedTxns);
                        setTransactions(sortTransactionsIST(parsed));
                    } else {
                        setTransactions(DEFAULT_DEMO_TXNS);
                    }
                } catch(e) {
                    setTransactions(DEFAULT_DEMO_TXNS);
                }

                syncUserToFirestore(user.uid, user.email, currentBal);

                // 3. Real-time Firestore sync strictly isolated to users/{cleanDocId}
                if (typeof db !== 'undefined' && db !== null) {
                    const unsubUser = db.collection("users").doc(cleanDocId).onSnapshot(doc => {
                        if (doc.exists && doc.data().balance !== undefined) {
                            const dbBal = parseFloat(doc.data().balance);
                            setBalance(dbBal);
                            try { localStorage.setItem(balKey, dbBal.toString()); } catch(e) {}
                        }
                    }, err => console.warn("Firestore user sync error:", err));

                    const unsubTxns = db.collection("users").doc(cleanDocId).collection("transactions")
                        .onSnapshot(snapshot => {
                            if (!snapshot.empty) {
                                const dbTxns = snapshot.docs.map(doc => doc.data());
                                const sorted = sortTransactionsIST(dbTxns);
                                setTransactions(sorted);
                                try { localStorage.setItem(userKey, JSON.stringify(sorted)); } catch(e) {}
                            }
                        }, err => console.warn("Firestore txns sync error:", err));

                    return () => {
                        unsubUser();
                        unsubTxns();
                    };
                }
            }, [user]);

            useEffect(() => {
                if (typeof auth !== 'undefined' && auth !== null) {
                    const unsubscribe = auth.onAuthStateChanged(currentUser => {
                        if (currentUser) {
                            const uObj = { email: currentUser.email || currentUser.phoneNumber, uid: currentUser.uid, provider: "Firebase Auth" };
                            setUser(uObj);
                            localStorage.setItem("paysphere_user", JSON.stringify(uObj));
                        }
                    });
                    return () => unsubscribe();
                }
            }, []);

            const handleUnifiedAuth = async (e) => {
                e.preventDefault();
                setAuthMsg('');
                let rawId = loginInput.trim().toLowerCase();
                const pwd = loginPassword;

                if (!rawId || !pwd) {
                    setAuthMsg("Please enter your Email or Phone Number and Password.");
                    return;
                }

                if (pwd.length < 6) {
                    setAuthMsg("Password must be at least 6 characters long.");
                    return;
                }

                setIsAuthProcessing(true);
                const emailId = rawId.includes('@') ? rawId : `${rawId}@paysphere.app`;

                if (typeof auth !== 'undefined' && auth !== null) {
                    if (authMode === 'signup') {
                        try {
                            const res = await auth.createUserWithEmailAndPassword(emailId, pwd);
                            const uObj = { email: res.user.email, uid: res.user.uid, provider: "Firebase Auth" };
                            setUser(uObj);
                            localStorage.setItem("paysphere_user", JSON.stringify(uObj));
                            syncUserToFirestore(res.user.uid, res.user.email, INITIAL_SEED_BALANCE);
                            setIsAuthProcessing(false);
                            return;
                        } catch (fbErr) {
                            console.error("[Firebase Auth Signup]", fbErr);
                            if (fbErr.code === 'auth/email-already-in-use') {
                                setAuthMsg("An account with this email already exists in Firebase. Please Sign In.");
                            } else {
                                setAuthMsg(fbErr.message);
                            }
                            setIsAuthProcessing(false);
                            return;
                        }
                    } else {
                        try {
                            const res = await auth.signInWithEmailAndPassword(emailId, pwd);
                            const uObj = { email: res.user.email, uid: res.user.uid, provider: "Firebase Auth" };
                            setUser(uObj);
                            localStorage.setItem("paysphere_user", JSON.stringify(uObj));
                            syncUserToFirestore(res.user.uid, res.user.email, INITIAL_SEED_BALANCE);
                            setIsAuthProcessing(false);
                            return;
                        } catch (fbErr) {
                            console.error("[Firebase Auth Signin]", fbErr);
                            if (fbErr.code === 'auth/wrong-password' || fbErr.code === 'auth/invalid-credential') {
                                setAuthMsg("Invalid credentials. Please check your email and password.");
                            } else if (fbErr.code === 'auth/user-not-found') {
                                setAuthMsg("Account not found in Firebase Auth! Please click 'Sign Up' first.");
                            } else {
                                setAuthMsg(fbErr.message);
                            }
                            setIsAuthProcessing(false);
                            return;
                        }
                    }
                }

                const uid = "USER-" + Math.abs(rawId.split('').reduce((acc, ch) => ((acc << 5) - acc) + ch.charCodeAt(0), 0));
                const uObj = { email: rawId, uid: uid };
                setUser(uObj);
                localStorage.setItem("paysphere_user", JSON.stringify(uObj));
                syncUserToFirestore(uid, rawId, INITIAL_SEED_BALANCE);
                setIsAuthProcessing(false);
            };

            const handleGoogleAuth = async () => {
                setAuthMsg('');
                setIsAuthProcessing(true);

                if (typeof auth !== 'undefined' && auth !== null) {
                    try {
                        const provider = new firebase.auth.GoogleAuthProvider();
                        provider.setCustomParameters({ prompt: 'select_account' });
                        const res = await auth.signInWithPopup(provider);
                        const uObj = { email: res.user.email, uid: res.user.uid, provider: "Google Account" };
                        setUser(uObj);
                        localStorage.setItem("paysphere_user", JSON.stringify(uObj));
                        syncUserToFirestore(res.user.uid, res.user.email, INITIAL_SEED_BALANCE);
                        setIsAuthProcessing(false);
                        return;
                    } catch (err) {
                        console.warn("[Google Auth]", err);
                    }
                }

                const selectedAccount = prompt("Select Google Account:", "vankireddi.s2023@vitstudent.ac.in");
                if (selectedAccount) {
                    const gEmail = selectedAccount.trim().toLowerCase();
                    const uid = `GOOGLE-${Math.abs(gEmail.split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0))}`;
                    const uObj = { email: gEmail, uid: uid };
                    setUser(uObj);
                    localStorage.setItem("paysphere_user", JSON.stringify(uObj));
                    syncUserToFirestore(uid, gEmail, INITIAL_SEED_BALANCE);
                }
                setIsAuthProcessing(false);
            };

            const handleSignOut = () => {
                if (typeof auth !== 'undefined' && auth !== null) {
                    try { auth.signOut(); } catch (e) {}
                }
                setUser(null);
                setTransactions([]);
                localStorage.removeItem("paysphere_user");
            };

            const handleAddMoney = (e) => {
                e.preventDefault();
                setTopUpNotice(null);
                const addAmt = parseFloat(topUpAmount);

                if (!addAmt || addAmt <= 0) {
                    setTopUpNotice({ type: 'error', text: 'Please enter a valid amount to add to your wallet.' });
                    return;
                }

                const newBal = balance + addAmt;
                updateBalanceInDatabase(user, newBal);

                const nowMs = Date.now();
                const txnId = `TOPUP-${Math.floor(10000 + Math.random() * 90000)}`;
                const topUpTxn = {
                    id: txnId,
                    timestamp: nowMs,
                    date: formatISTDate({ timestamp: nowMs }),
                    recipient: `Deposit via ${topUpSource}`,
                    category: "Wallet Top-Up",
                    amount: addAmt,
                    type: "Credit",
                    riskProfile: "Low Risk",
                    securityStatus: "✅ Verified Deposit",
                    status: "Completed",
                    user_email: user.email,
                    user_uid: user.uid
                };

                const updatedTxns = sortTransactionsIST([topUpTxn, ...transactions]);
                setTransactions(updatedTxns);

                const userId = String(user.uid || user.email).toLowerCase().trim();
                const cleanDocId = userId.replace(/[^a-zA-Z0-9_@.-]/g, '_');
                try { localStorage.setItem(`paysphere_txns_${cleanDocId}`, JSON.stringify(updatedTxns)); } catch(e) {}

                if (typeof db !== 'undefined' && db !== null) {
                    db.collection("users").doc(cleanDocId).collection("transactions").doc(txnId).set(topUpTxn).catch(() => {});
                    db.collection("transactions").doc(txnId).set(topUpTxn).catch(() => {});
                }

                setTopUpAmount('');
                setTopUpNotice({ type: 'success', text: `Successfully added ₹${addAmt.toLocaleString('en-IN')} to your PaySphere wallet!` });
            };

            // REAL-TIME AI FRAUD RISK EVALUATION WITH HIGH VELOCITY / REPEATED RECIPIENT DETECTION
            const handleInitiatePayment = (e) => {
                e.preventDefault();
                setPaymentNotice(null);

                const amt = parseFloat(amount);
                if (!recipient || !amt || amt <= 0) return;

                if (amt > balance) {
                    setPaymentNotice({ type: 'error', text: `Insufficient Available Balance (Current: ₹${balance.toLocaleString('en-IN')})` });
                    return;
                }

                if (transferType === 'Blacklisted/Suspicious' || recipient.toLowerCase().includes('blacklisted') || recipient.toLowerCase().includes('scam')) {
                    setPaymentNotice({ 
                        type: 'error', 
                        text: '⚠️ Transaction Blocked by PaySphere Fraud Guard: Recipient account is flagged for security risk.' 
                    });
                    return;
                }

                const nowMs = Date.now();
                const txnId = `TXN-${Math.floor(10000 + Math.random() * 90000)}`;

                // CHECK REPEATED TRANSFERS & CUMULATIVE VOLUME TO SAME RECIPIENT IN LAST 1 HOUR
                const cleanRecipient = recipient.toLowerCase().trim();
                const recentSameRecipientTxns = transactions.filter(t => {
                    const tRecipient = String(t.recipient || '').toLowerCase().trim();
                    const tTime = getTxnTime(t);
                    return tRecipient === cleanRecipient && (nowMs - tTime) < 3600000;
                });

                const repeatCount = recentSameRecipientTxns.length;
                const priorTotalAmt = recentSameRecipientTxns.reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);
                const cumulativeAmt = priorTotalAmt + amt;

                const isVeryHighAmount = amt >= 5000000; // >= 50 Lakhs single transfer
                const isMediumAmount = amt >= 50000;    // >= 50k single transfer
                const isWire = transferType === 'Bank Wire';

                let riskProf = "Low Risk";
                let secStatus = "✅ Low Risk (Verified)";
                let txnStatus = "Completed";
                let calculatedScore = 12;

                // HIGH RISK CONDITIONS:
                // 1. Single massive transfer >= ₹5,000,000 (50 Lakhs)
                // 2. High Velocity Attack: 5 or more rapid transfers to the same recipient within 1 hour
                // 3. High Cumulative Burst: Cumulative amount to same recipient in 1 hour exceeds ₹500,000 AND repeatCount >= 2
                if (isVeryHighAmount || repeatCount >= 4 || (repeatCount >= 2 && cumulativeAmt >= 500000)) {
                    riskProf = "High Risk";
                    secStatus = `⚠️ High Risk (Flagged / High Velocity Transfer #${repeatCount + 1})`;
                    txnStatus = "Flagged";
                    calculatedScore = 92;
                } 
                // MEDIUM RISK CONDITIONS:
                // 1. Amount >= ₹50,000 or Bank Wire transfer
                // 2. 3rd or 4th repeat transfer to same recipient (repeatCount >= 2)
                // 3. Cumulative amount to same recipient in 1 hour exceeds ₹100,000
                else if (isMediumAmount || isWire || repeatCount >= 2 || cumulativeAmt >= 100000) {
                    riskProf = "Medium Risk";
                    if (repeatCount >= 2 || cumulativeAmt >= 100000) {
                        secStatus = `🔒 Medium Risk (2FA / Repeat Transfer #${repeatCount + 1})`;
                    } else {
                        secStatus = "🔒 Medium Risk (2FA Verified)";
                    }
                    calculatedScore = 65;
                }
                // LOW RISK: Routine smaller transfers (e.g. 1st or 2nd transfer of ₹3,000 to same person)
                else {
                    riskProf = "Low Risk";
                    secStatus = "✅ Low Risk (Verified)";
                    calculatedScore = 12;
                }

                const newTxnData = {
                    id: txnId,
                    timestamp: nowMs,
                    date: formatISTDate({ timestamp: nowMs }),
                    recipient: recipient,
                    category: category,
                    amount: amt,
                    transferType: transferType,
                    type: "Debit",
                    riskProfile: riskProf,
                    securityStatus: secStatus,
                    status: txnStatus,
                    riskScore: calculatedScore,
                    user_email: user.email,
                    user_uid: user.uid
                };

                if (riskProf === "High Risk" || riskProf === "Medium Risk") {
                    setPendingTransaction(newTxnData);
                    setOtpValues(['', '', '', '', '', '']);
                    setOtpError('');
                    setShow2FAModal(true);
                } else {
                    executeFinalPayment(newTxnData);
                    setPaymentNotice({ type: 'success', text: `Payment of ₹${amt.toLocaleString('en-IN')} sent successfully.` });
                }
            };

            const executeFinalPayment = (txnData) => {
                const updatedTxns = sortTransactionsIST([txnData, ...transactions]);
                setTransactions(updatedTxns);

                const newBal = Math.max(0, balance - txnData.amount);
                updateBalanceInDatabase(user, newBal);

                const userId = String(user.uid || user.email).toLowerCase().trim();
                const cleanDocId = userId.replace(/[^a-zA-Z0-9_@.-]/g, '_');

                try { localStorage.setItem(`paysphere_txns_${cleanDocId}`, JSON.stringify(updatedTxns)); } catch(e) {}

                if (typeof db !== 'undefined' && db !== null) {
                    db.collection("users").doc(cleanDocId).collection("transactions").doc(txnData.id).set(txnData).catch(() => {});
                    db.collection("transactions").doc(txnData.id).set(txnData).catch(() => {});
                }

                if (typeof rtdb !== 'undefined' && rtdb !== null) {
                    try {
                        rtdb.ref(`security_logs/${cleanDocId}/${txnData.id}`).set({
                            timestamp: formatISTDate({ timestamp: txnData.timestamp }),
                            amount: txnData.amount,
                            recipient: txnData.recipient,
                            riskProfile: txnData.riskProfile,
                            securityStatus: txnData.securityStatus
                        }).catch(() => {});
                    } catch(e) {}
                }

                setRecipient('');
                setAmount('');
            };

            const handleVerify2FA = (e) => {
                e.preventDefault();
                const code = otpValues.join('');
                if (code.length < 6) {
                    setOtpError("Please enter the complete 6-digit OTP security code.");
                    return;
                }

                if (pendingTransaction) {
                    executeFinalPayment(pendingTransaction);
                    setShow2FAModal(false);
                    setPendingTransaction(null);
                    setPaymentNotice({ 
                        type: 'success', 
                        text: `${pendingTransaction.riskProfile === 'High Risk' ? '⚠️ High Risk Authorized via 2FA OTP!' : '2FA Verified!'} Payment of ₹${pendingTransaction.amount.toLocaleString('en-IN')} authorized.` 
                    });
                }
            };

            const handleOtpChange = (val, idx) => {
                if (/^[0-9]?$/.test(val)) {
                    const newOtp = [...otpValues];
                    newOtp[idx] = val;
                    setOtpValues(newOtp);
                    if (val && idx < 5) {
                        const nextElem = document.getElementById(`otp-input-${idx + 1}`);
                        if (nextElem) nextElem.focus();
                    }
                }
            };

            const handleSendMessage = (e) => {
                e.preventDefault();

                        reply = `I have analyzed your recent activity. You have ${transactions.length} active transactions with a remaining balance of ₹${balance.toLocaleString('en-IN')}. How else can I assist your financial planning today?`;
                    }

                    setChatMessages([...updated, { sender: 'assistant', text: reply }]);
                }, 400);
            };

            // USER SIGN-IN / SIGN-UP PORTAL
            if (!user) {
                return (

                                </div>

                                <p className="text-xs text-slate-400">Secure Client Access & Identity Verification</p>

                                    Sign In

                                <button onClick={() => { setAuthMode('signup'); setAuthMsg(''); }} className={`flex-1 py-2 font-bold rounded-lg transition-all text-center ${authMode === 'signup' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                                    Sign Up
                                </button>
                            </div>

                            {authMsg && (

                                </div>

                            <form onSubmit={handleUnifiedAuth} className="space-y-4 text-xs">

                                </div>
                            </div>

                    {/* Main Navigation Tabs */}

                                <Icon name="credit-card" className="w-4 h-4" />

                            </button>
                            <button onClick={() => setActiveTab('add_money')} className={`pb-3.5 px-4 text-sm font-semibold flex items-center space-x-2 border-b-2 transition-all whitespace-nowrap ${activeTab === 'add_money' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>

                        {/* TAB 1: PAYMENTS & RECENT TRANSACTIONS TABLE */}
                        {activeTab === 'payments' && (

                        {/* TAB 2: ADD MONEY / TOP UP WALLET BALANCE */}
                        {activeTab === 'add_money' && (
                            <div className="max-w-xl mx-auto glass-panel p-8 rounded-3xl space-y-6">
                                <div className="text-center space-y-2">
                                    <div className="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 mx-auto flex items-center justify-center">
                                        <Icon name="plus" className="w-6 h-6" />
                                    </div>
                                    <h3 className="text-lg font-bold text-white">Top Up PaySphere Wallet Balance</h3>
                                    <p className="text-xs text-slate-400">Add funds instantly to your wallet. Synced to Cloud Firestore.</p>
                                </div>

                                {topUpNotice && (
                                    <div className={`p-3.5 rounded-xl text-xs font-semibold border ${topUpNotice.type === 'error' ? 'bg-red-500/10 border-red-500/20 text-red-300' : 'bg-emerald-500/10 border-emerald-500/20 text-emerald-300'}`}>
                                        {topUpNotice.text}
                                    </div>
                                )}

                                <form onSubmit={handleAddMoney} className="space-y-4 text-xs">
                                    <div>
                                        <label className="block font-semibold text-slate-300 mb-1">Select / Enter Amount (₹ INR)</label>
                                        <input 
                                            type="number" 
                                            step="100" 
                                            value={topUpAmount} 
                                            onChange={e => setTopUpAmount(e.target.value)} 
                                            placeholder="e.g. 50000" 
                                            className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white text-base font-bold focus:outline-none focus:border-emerald-500" 
                                            required 
                                        />
                                    </div>

                                    <div className="grid grid-cols-4 gap-2">
                                        {[5000, 10000, 50000, 100000].map(amt => (
                                            <button type="button" key={amt} onClick={() => setTopUpAmount(amt.toString())} className="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 font-bold py-2 rounded-xl text-xs transition-all">
                                                +₹{amt.toLocaleString('en-IN')}
                                            </button>
                                        ))}
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-slate-300 mb-1">Deposit Source</label>
                                        <select value={topUpSource} onChange={e => setTopUpSource(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500">
                                            <option>UPI / Instant NetBanking</option>
                                            <option>Debit / Credit Card</option>
                                            <option>Direct Bank Wire</option>
                                        </select>
                                    </div>

                                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-500/20 text-sm flex items-center justify-center space-x-2 transition-all">
                                        <Icon name="plus" className="w-4 h-4" />
                                        <span>Deposit Funds to Wallet</span>
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* TAB 3: DEDICATED AI RISK RANGE SLIDERS TAB */}
                        {activeTab === 'fraud_simulator' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                <div className="glass-panel p-6 rounded-2xl space-y-6">
                                    <h3 className="text-base font-bold text-white flex items-center space-x-2">
                                        <Icon name="cpu" className="w-5 h-5 text-purple-400" />
                                        <span>AI Risk Calculation Sliders</span>
                                    </h3>
                                    <p className="text-xs text-slate-400">Adjust the range sliders below to simulate live risk parameters!</p>

                                    <div className="space-y-6">
                                        <div>
                                            <div className="flex justify-between text-xs font-semibold mb-2">
                                                <span className="text-slate-300">1. Money Amount (₹ INR)</span>
                                                <span className="text-purple-400 font-mono font-bold text-sm">₹{parseInt(simAmount).toLocaleString('en-IN')}</span>
                                            </div>
                                            <input type="range" min="1000" max="500000" step="5000" value={simAmount} onChange={e => { setSimAmount(e.target.value); calculateSimulatedRisk(e.target.value, simVelocity, simDistance); }} className="w-full accent-purple-500 bg-slate-900" />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs font-semibold mb-2">
                                                <span className="text-slate-300">2. Transfer Speed / Velocity (Transfers in 1 hr)</span>
                                                <span className="text-purple-400 font-mono font-bold text-sm">{simVelocity} transfers/hr</span>
                                            </div>
                                            <input type="range" min="1" max="10" value={simVelocity} onChange={e => { setSimVelocity(e.target.value); calculateSimulatedRisk(simAmount, e.target.value, simDistance); }} className="w-full accent-purple-500 bg-slate-900" />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs font-semibold mb-2">
                                                <span className="text-slate-300">3. Location Distance from Home (km)</span>
                                                <span className="text-purple-400 font-mono font-bold text-sm">{simDistance} km</span>
                                            </div>
                                            <input type="range" min="0" max="1000" step="10" value={simDistance} onChange={e => { setSimDistance(e.target.value); calculateSimulatedRisk(simAmount, simVelocity, e.target.value); }} className="w-full accent-purple-500 bg-slate-900" />
                                        </div>
                                    </div>

                                    <div className="p-6 bg-slate-900/80 rounded-2xl border border-slate-800 text-center space-y-2">
                                        <p className="text-xs font-bold uppercase tracking-wider text-slate-400">Calculated Risk Index</p>
                                        <div className="text-5xl font-black gradient-brand my-1">{simRiskScore} / 100</div>
                                        <p className="text-xs font-semibold">
                                            Status: <span className={simRiskScore >= 75 ? "text-red-400 font-bold" : (simRiskScore >= 40 ? "text-amber-400 font-bold" : "text-emerald-400 font-bold")}>
                                                {simRiskScore >= 75 ? "⚠️ HIGH RISK (FLAGGED / AUDIT)" : (simRiskScore >= 40 ? "🔒 MEDIUM RISK (REQUIRES 2FA)" : "✅ LOW RISK (INSTANT APPROVED)")}
                                            </span>
                                        </p>
                                    </div>
                                </div>

                                <div className="glass-panel p-6 rounded-2xl space-y-4">
                                    <h3 className="text-base font-bold text-white">How Risk is Calculated</h3>
                                    <div className="space-y-4 text-xs">
                                        <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                                            <div className="font-bold text-white text-sm mb-1">💰 Transaction Amount</div>
                                            <div className="text-slate-400">Higher amounts (₹50,000+) increase the risk score and trigger mandatory 2FA security.</div>
                                        </div>

                                        <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                                            <div className="font-bold text-white text-sm mb-1">⚡ Transfer Velocity</div>
                                            <div className="text-slate-400">Multiple rapid payments in 1 hour indicate automated script attacks or account takeover attempts.</div>
                                        </div>

                                        <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                                            <div className="font-bold text-white text-sm mb-1">📍 Geolocation Distance</div>
                                            <div className="text-slate-400">Transfers originating far from your registered home location (500+ km) trigger high risk alerts.</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 4: PAYSPHERE SHIELD SECURITY */}
                        {activeTab === 'security' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                <div className="glass-panel p-6 rounded-2xl space-y-6">
                                    <h3 className="text-base font-bold text-white flex items-center space-x-2">
                                        <Icon name="shield" className="w-5 h-5 text-purple-400" />
                                        <span>Security Shield Protection</span>
                                    </h3>

                                    <div className="space-y-4 text-xs">
                                        <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 flex items-center justify-between">
                                            <div>
                                                <div className="font-bold text-white text-sm">Two-Factor Authentication (2FA)</div>
                                                <div className="text-slate-400 mt-0.5">Enforced for high-value transfers (≥ ₹50,000)</div>
                                            </div>
                                            <span className="bg-emerald-500/20 text-emerald-300 text-[10px] font-bold px-2.5 py-1 rounded-full">ACTIVE</span>
                                        </div>

                                        <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 flex items-center justify-between">
                                            <div>
                                                <div className="font-bold text-white text-sm">Blacklisted Account Filtering</div>
                                                <div className="text-slate-400 mt-0.5">Automatically blocks flagged scam accounts</div>
                                            </div>
                                            <span className="bg-emerald-500/20 text-emerald-300 text-[10px] font-bold px-2.5 py-1 rounded-full">ACTIVE</span>
                                        </div>

                                        <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 flex items-center justify-between">
                                            <div>
                                                <div className="font-bold text-white text-sm">App Check Token Verification</div>
                                                <div className="text-slate-400 mt-0.5">Protects payment endpoints from automated bot attacks</div>
                                            </div>
                                            <span className="bg-emerald-500/20 text-emerald-300 text-[10px] font-bold px-2.5 py-1 rounded-full">VERIFIED</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="glass-panel p-6 rounded-2xl space-y-4">
                                    <h3 className="text-base font-bold text-white">Live Threat Log Feed</h3>
                                    <div className="space-y-3 text-xs">
                                        {transactions.map(t => (
                                            <div key={t.id} className="p-3.5 bg-slate-900/70 rounded-xl border border-slate-800 flex items-center justify-between">
                                                <div>
                                                    <div className="font-bold text-slate-200">{t.recipient}</div>
                                                    <div className="text-[10px] text-slate-400">{formatISTDate(t)} • ₹{t.amount.toLocaleString('en-IN')}</div>
                                                </div>
                                                <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full ${
                                                    t.riskProfile === 'High Risk' || t.status === 'Flagged' || (t.riskScore && t.riskScore >= 75) || (t.securityStatus && (t.securityStatus.includes('High Risk') || t.securityStatus.includes('Repeat')))
                                                        ? 'bg-red-500/20 text-red-300 border border-red-500/30'
                                                        : (t.riskProfile === 'Medium Risk' || (t.securityStatus && t.securityStatus.includes('2FA')) || t.amount >= 50000
                                                            ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30'
                                                            : 'bg-emerald-500/20 text-emerald-300')
                                                }`}>
                                                    {t.securityStatus || (t.riskProfile ? `${t.riskProfile} Profile` : 'Verified')}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 5: SMART FINANCIAL INSIGHTS */}
                        {activeTab === 'insights' && (
                            <div className="max-w-3xl mx-auto glass-panel rounded-2xl overflow-hidden flex flex-col h-[550px]">
                                <div className="p-4 border-b border-slate-800 bg-slate-900/60 flex items-center justify-between">
                                    <div className="flex items-center space-x-3">
                                        <div className="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                                            <Icon name="bot" className="w-5 h-5" />
                                        </div>
                                        <div>
                                            <h3 className="text-sm font-bold text-white">PaySphere Financial Advisor</h3>
                                            <p className="text-[10px] text-emerald-400 font-medium">Smart Insights for {user.email}</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex-1 p-6 overflow-y-auto space-y-4">
                                    {chatMessages.map((msg, i) => (
                                        <div key={i} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[85%] rounded-2xl p-4 text-xs leading-relaxed whitespace-pre-line ${msg.sender === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-none'}`}>
                                                {msg.text}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <form onSubmit={handleSendMessage} className="p-4 border-t border-slate-800 bg-slate-900/40 flex space-x-3">
                                    <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="Ask: 'what is my balance?' or 'summarize my spending'" className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500" />
                                    <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl font-bold text-xs transition-all flex items-center space-x-1">
                                        <span>Ask</span>
                                        <Icon name="send" className="w-3.5 h-3.5" />
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* TAB 6: ANALYTICS & BREAKDOWN */}
                        {activeTab === 'analytics' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div className="glass-panel p-6 rounded-2xl">
                                    <p className="text-xs font-semibold text-slate-400">Total Spent</p>
                                    <h4 className="text-3xl font-black text-white my-2">
                                        ₹{transactions.filter(t => t.type === 'Debit').reduce((a, b) => a + b.amount, 0).toLocaleString('en-IN')}
                                    </h4>
                                    <p className="text-xs text-emerald-400">Across {transactions.length} transactions</p>
                                </div>

                                <div className="glass-panel p-6 rounded-2xl">
                                    <p className="text-xs font-semibold text-slate-400">Average Transaction</p>
                                    <h4 className="text-3xl font-black text-purple-400 my-2">
                                        ₹{Math.round(transactions.reduce((a, b) => a + b.amount, 0) / (transactions.length || 1)).toLocaleString('en-IN')}
                                    </h4>
                                    <p className="text-xs text-slate-400">Verified by PaySphere Shield</p>
                                </div>

                                <div className="glass-panel p-6 rounded-2xl">
                                    <p className="text-xs font-semibold text-slate-400">Security Approval Rate</p>
                                    <h4 className="text-3xl font-black text-emerald-400 my-2">98.5%</h4>
                                    <p className="text-xs text-emerald-400">Real-time threat monitoring</p>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* INTERACTIVE 2FA OTP MODAL */}
                    {show2FAModal && pendingTransaction && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="glass-panel bg-slate-950 border border-indigo-500/30 max-w-md w-full p-8 rounded-3xl text-white space-y-6 shadow-2xl">
                                <div className="text-center space-y-2">
                                    <div className="w-12 h-12 rounded-2xl bg-indigo-600 mx-auto flex items-center justify-center shadow-lg shadow-indigo-500/30">
                                        <Icon name="lock" className="w-6 h-6 text-white" />
                                    </div>
                                    <h3 className="text-lg font-bold text-white">
                                        {pendingTransaction.riskProfile === 'High Risk' ? '⚠️ HIGH RISK ALERT — 2FA REQUIRED' : 'Two-Factor Authentication (2FA)'}
                                    </h3>
                                    <p className="text-xs text-slate-400">
                                        {pendingTransaction.riskProfile === 'High Risk' 
                                            ? `⚠️ PaySphere Fraud Guard: Rapid repeat transfer to '${pendingTransaction.recipient}' detected!` 
                                            : `Transaction of ₹${pendingTransaction.amount.toLocaleString('en-IN')} requires 2FA OTP verification.`}
                                    </p>
                                </div>

                                {otpError && (
                                    <div className="bg-red-500/10 border border-red-500/20 text-red-300 p-3 rounded-xl text-xs font-medium text-center">
                                        {otpError}
                                    </div>
                                )}

                                <form onSubmit={handleVerify2FA} className="space-y-6">
                                    <div className="flex justify-center space-x-2">
                                        {otpValues.map((val, idx) => (
                                            <input 
                                                key={idx} 
                                                id={`otp-input-${idx}`} 
                                                type="text" 
                                                maxLength="1" 
                                                value={val} 
                                                onChange={e => handleOtpChange(e.target.value, idx)} 
                                                className="otp-input" 
                                                autoFocus={idx === 0} 
                                            />
                                        ))}
                                    </div>

                                    <div className="space-y-3">
                                        <button type="submit" className="w-full gradient-btn text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-500/20 text-sm">
                                            Verify & Authorize Payment
                                        </button>
                                        <button type="button" onClick={() => { setShow2FAModal(false); setPendingTransaction(null); }} className="w-full bg-slate-900 hover:bg-slate-800 text-slate-400 text-xs font-semibold py-2.5 rounded-xl">
                                            Cancel Transaction
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Receipt Modal */}
                    {selectedTxn && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="glass-panel bg-slate-950 border border-slate-700 max-w-md w-full p-6 rounded-2xl text-white space-y-4">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="font-bold text-sm">Official Payment Receipt</h3>
                                    <button onClick={() => setSelectedTxn(null)} className="text-slate-400 hover:text-white">✕</button>
                                </div>

                                <div className="space-y-2 text-xs">
                                    <div className="flex justify-between"><span className="text-slate-400">Transaction ID:</span><span className="font-mono font-bold">{selectedTxn.id}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">Indian Timestamp (IST):</span><span>{formatISTDate(selectedTxn)}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">Recipient:</span><span className="font-bold">{selectedTxn.recipient}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">Category:</span><span>{selectedTxn.category}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">Amount Paid:</span><span className="font-bold text-emerald-400">₹{selectedTxn.amount.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-400">Risk Profile / Security Status:</span><span className="font-bold text-amber-400">{selectedTxn.securityStatus || selectedTxn.riskProfile || 'Verified'}</span></div>
                                </div>

                                <div className="pt-4 border-t border-slate-800 flex space-x-3">
                                    <button onClick={() => window.print()} className="flex-1 gradient-btn text-white font-bold py-2 rounded-xl text-xs">
                                        Print / Save PDF
                                    </button>
                                    <button onClick={() => setSelectedTxn(null)} className="bg-slate-900 hover:bg-slate-800 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs">
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
